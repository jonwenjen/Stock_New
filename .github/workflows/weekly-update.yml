name: Weekly data update

# Every Wednesday 22:10 Taipei time (14:10 UTC): Taiwan's close, institutional
# flows and margin balances for the day are all published by then.
on:
  schedule:
    - cron: "10 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build data
        env:
          # Optional. Without it the site shows the rule-based commentary only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. SEC asks automated clients for "name contact-email".
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m pipeline.build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data config/cusip_cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
            git push
          fi
